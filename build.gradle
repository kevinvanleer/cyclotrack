buildscript {
    ext.kotlin_version = '2.2.10'
    ext.room_version = '2.8.4'
    ext.dagger_version = '2.59.1'
    ext.nav_version = '2.9.7'
    ext.powermock_version = "2.0.9"
    ext.androidx_test = "1.5.0"
    ext.work_version = "2.11.1"
    ext.fragment_version = "1.8.9"
    ext.moshi_version = "1.15.2"
    ext.lifecycle_version = "2.10.0"

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.1'
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$nav_version"
        classpath 'com.google.gms:google-services:4.4.3'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.5'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

plugins {
    id 'org.ajoberstar.grgit' version '5.3.2'
    id 'com.google.dagger.hilt.android' version "$dagger_version" apply false
    id 'com.android.application' version '9.0.1' apply false
    id 'com.android.library' version '9.0.1' apply false
    id 'com.android.legacy-kapt' version '9.0.1' apply false
    id 'androidx.room' version "$room_version" apply false
    id 'com.google.devtools.ksp' version '2.3.5' apply false
}

allprojects {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

apply plugin: 'idea'
idea.module {
    excludeDirs += file('www/')
    excludeDirs += file('db_baks/')
}
